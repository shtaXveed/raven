[mcu EBBCan3]
canbus_uuid: e585f4290aa8 # a44bbdad8b79

[extruder3]
step_pin: EBBCan3: PD0
dir_pin: !EBBCan3: PD1
enable_pin: !EBBCan3: PD2
microsteps: 16
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
heater_pin: EBBCan3: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G #EPCOS 100K B57560G104F
sensor_pin: EBBCan3: PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_extrude_temp: 170
min_temp: -273.15
max_temp: 250
max_power: 1.0
pressure_advance: 0.025
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040

[tmc2209 extruder3]
uart_pin: EBBCan3: PA15
run_current: 0.650
stealthchop_threshold: 0


##Tool 0##
[fan_generic T3_part_fan]
pin: EBBCan3: PA1

[heater_fan T3_hotend_fan]
pin: EBBCan3: PA0
heater: extruder3
heater_temp: 50.0

[neopixel T3]
pin: EBBCan3:PD3
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
[temperature_sensor T2]
sensor_type: temperature_mcu
sensor_mcu: EBBCan3
min_temp: 0
max_temp: 100

[gcode_macro T3]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode: SELECT_TOOL T=3

# Results from input shaper
# Uncomment the following lines if you have input shaper results for this tool
# params_input_shaper_freq_x: 50.0
# params_input_shaper_type_x: 'mzv'
# params_input_shaper_damping_ratio_x: 0.15
# params_input_shaper_freq_y: 50.0
# params_input_shaper_type_y: 'mzv'
# params_input_shaper_damping_ratio_y: 0.15

# change the tool section name to the tool you are configuring:
# T0, T1, etc.
[tool T3]
tool_number: 3 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder3 # change to match the extruder you are configuring: extruder, extruder1, etc.
fan: T3_part_fan
detection_pin: ^!EBBCan3:PB6
params_park_x: 212.1 # The absolute X-position of the tool in its dock.
params_park_y: 4.8 # The absolute Y-position of the tool in its dock.
params_park_z: 298 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: -0.600
gcode_y_offset: -0.240 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: 0 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

